:root{
  --bg:#F7F3EC; --card:#FFFDF9; --text:#0F2A20; --muted:#566860; --accent:#0B4A33;
  --line:#CDBFA3; --track:rgba(205,191,163,.45); --soft:#F1EBDF;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);overflow-x:hidden}
body{max-width:390px;margin:0 auto;padding:16px 16px 40px;font-size:15px;line-height:1.4;-webkit-text-size-adjust:100%}
.intro{font:400 12px/1.4 system-ui,sans-serif;color:var(--muted);margin:0 0 20px}
.tag{margin:28px 0 8px;font:400 11px/1.3 system-ui,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.tag b{color:var(--accent);font-weight:600;margin-right:8px}

.card{background:var(--card);border-radius:24px;padding:22px 20px 20px;box-shadow:0 8px 24px rgba(15,42,32,.05);font-family:var(--txt);font-weight:400;font-size:15px}
.cap{font-size:11px;line-height:1.3;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:400}
.title{font-family:var(--disp);font-weight:var(--hw,400);font-size:18px;line-height:1.3;margin:6px 0 0;color:var(--text)}
.num{font-family:var(--disp);font-weight:var(--nw);font-size:44px;line-height:1.1;margin:18px 0 0;color:var(--accent);font-variant-numeric:lining-nums;letter-spacing:-.01em}
.of{font-size:15px;color:var(--muted);margin:2px 0 0}
.bar{height:4px;border-radius:2px;background:var(--track);margin:16px 0 10px;overflow:hidden}
.bar i{display:block;height:100%;width:59.5%;background:var(--accent);border-radius:2px}
.stats{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);line-height:1.5}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:20px;padding-top:16px;border-top:1px solid var(--track)}
.row .name{font-size:15px}
.row .name small{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:2px}
.ctl{display:flex;align-items:center;gap:12px;flex:none}
.ctl span{font-family:var(--disp);font-weight:var(--nw);font-size:22px;min-width:28px;text-align:center;color:var(--accent)}
.ctl button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--text);font:400 18px/1 var(--txt);display:flex;align-items:center;justify-content:center;padding:0}
.main{display:block;width:100%;margin-top:20px;height:48px;border:0;border-radius:14px;background:var(--accent);color:var(--bg);font:400 15px/1 var(--txt);letter-spacing:.04em}

.f1{--disp:'Jost';--txt:'Jost';--nw:200;--hw:400}
.f2{--disp:'Montserrat';--txt:'Montserrat';--nw:200;--hw:400}
.f3{--disp:'Raleway';--txt:'Raleway';--nw:200;--hw:400}
.f4{--disp:'Comfortaa';--txt:'Comfortaa';--nw:300;--hw:400}
.f5{--disp:'Tenor Sans';--txt:'Jost';--nw:400;--hw:400}
.f6{--disp:'Cormorant Garamond';--txt:'Jost';--nw:300;--hw:300}
.f7{--disp:'Forum';--txt:'Montserrat';--nw:400;--hw:400}
.f8{--disp:'Prata';--txt:'Raleway';--nw:400;--hw:400}
</style>
</head>
<body>
<p class="intro">Одна карточка «Сегодня», восемь пар шрифтов. Размеры одинаковые: цифра 44, заголовок 18, текст 15, подписи 11 px.</p>
<div id="list"></div>
<script>
var V=[
 ['Jost (всё), цифра Jost 200','f1'],
 ['Montserrat (всё), цифра 200','f2'],
 ['Raleway (всё), цифра 200','f3'],
 ['Comfortaa (всё), цифра 300','f4'],
 ['Tenor Sans (заголовки и цифра) + Jost 400 (текст)','f5'],
 ['Cormorant Garamond 300 (цифра и заголовки) + Jost 400 (текст)','f6'],
 ['Forum (цифра и заголовки) + Montserrat 400 (текст)','f7'],
 ['Prata (цифра и заголовки) + Raleway 400 (текст)','f8']
];
document.getElementById('list').innerHTML=V.map(function(v,i){
 return '<p class="tag"><b>'+(i+1)+'</b>'+v[0]+'</p>'+
 '<div class="card '+v[1]+'">'+
  '<div class="cap">Цель · месяц</div>'+
  '<h2 class="title" style="margin-bottom:0">400 000 ₽ за месяц</h2>'+
  '<div class="num">238 000</div>'+
  '<div class="of">из 400 000 ₽</div>'+
  '<div class="bar"><i></i></div>'+
  '<div class="stats">осталось 162 000 · 13 дней · серия 6</div>'+
  '<div class="row"><div class="name">Звонки · норма 15</div>'+
   '<div class="ctl"><button type="button" aria-label="Минус">−</button><span>9</span><button type="button" aria-label="Плюс">+</button></div></div>'+
  '<button class="main" type="button">Сохранить</button>'+
 '</div>';
}).join('');
</script>
</body>
</html>
